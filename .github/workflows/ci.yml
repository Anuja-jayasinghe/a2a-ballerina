name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.4

      - name: Build
        working-directory: a2a
        run: bal build

      - name: Test
        working-directory: a2a
        run: bal test

# NOTE: a separate `grpc-stub-freshness` job (re-running
# scripts/regen-grpc-stub.sh) and a `--disable-groups grpc` exclusion on the
# Test step above were part of the original design for this workflow
# (see a2a/docs/superpowers/plans/2026-08-01-grpc-transport-binding.md,
# Task 17), but that job's script and the excluded test group don't exist
# on `main` yet — the gRPC transport binding work (Tasks 1-16 of that plan)
# is still in progress on a separate branch and found a real Part.data
# marshalling defect that's parked pending a design fix. Re-add both the
# freshness job and the group exclusion when that branch merges.
