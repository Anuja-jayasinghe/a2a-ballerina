plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - A2A Package'

// TODO: revisit packageOrganization if D3 (ballerina vs ballerinax) changes.
ballerina {
    packageOrganization = "ballerina"
    module = "a2a"
    testCoverageParam = "--code-coverage --coverage-format=xml"
    langVersion = ballerinaLangVersion
    platform = "java21"
}
